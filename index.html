      nome da empresa, o que ela vende, onde fica e como falar com ela.
    -->

    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": ["Organization", "ProfessionalService"],
          "@id": "https://skilltechnologywork.com/#organizacao",
          "name": "Skill Technology Work",
          "alternateName": "SkillTech",
          "url": "https://skilltechnologywork.com",
          "logo": "https://skilltechnologywork.com/favicon.svg",

          "foundingDate": "2023",
          "email": "contato@skilltechnologywork.com",
          "telephone": "+5563982809010",
          "priceRange": "$$",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Goiania",
            "addressRegion": "GO",
            "addressCountry": "BR"
          },

            { "@type": "Country", "name": "Brasil" },
            { "@type": "State", "name": "Goias" },

          "sameAs": [
            "https://facebook.com/skilltechnologywork",
            "https://instagram.com/skilltechnologywork",
            "https://linkedin.com/company/skilltechnologywork",
            "https://www.youtube.com/@elenavossia"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "sales",
            "telephone": "+5563982809010",
            "email": "contato@skilltechnologywork.com",
            "availableLanguage": ["Portuguese"],
            "areaServed": "BR",
            "url": "https://skilltechnologywork.com/contato"
          }

          "publisher": { "@id": "https://skilltechnologywork.com/#organizacao" },
          "inLanguage": "pt-BR"
        }
      ]
    }
